name: Report a problem
description: Something in TEAA, TEAA + FRA + Hub, the hosted service or another ToolsEnabled tool does not work as described.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Do not paste passwords, tokens, API keys, cookies or private keys anywhere in this form.** Security problems go to security@toolsenabled.ai or the repository's Security tab, not a public issue.
  - type: dropdown
    id: product
    attributes:
      label: Which product?
      options:
        - TEAA (local MCP connection)
        - TEAA + FRA + Hub
        - Hosted service at toolsenabled.ai (account, sign-up, connecting computers)
        - Self-hosted server
        - Fleet
        - ToolsEngine
        - Knowledge
        - Website or documentation
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version that `teaa doctor` shows, or the name of the release archive you downloaded.
      placeholder: 0.5.0-alpha.9
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x64
        - Windows x64 (native)
        - Other
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent app
      description: Which app connects to TEAA, for example Claude Code, Codex or Cursor?
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
  - type: textarea
    id: doctor
    attributes:
      label: Output of `teaa doctor --json`
      description: Optional, but it helps a lot. Check it for anything private before pasting.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed passwords, tokens, API keys, cookies and private keys from everything above.
          required: true
